name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then unzip -oq "$ZIP" -d _src; fi
          SETTINGS=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$SETTINGS" ]; then echo "Khong thay settings.gradle.kts"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SensiScreen-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
